# Base Go lint configuration from the Nightshift standards (standards/industry/go).
# Copied by `nightshift standards sync` when the project has none; the project owns it afterwards.
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint
    - gosec
    - nilerr
    - contextcheck
    - noctx
    - bodyclose
    - modernize
    - wastedassign
    - nolintlint

formatters:
  enable:
    - gofmt
    - goimports
