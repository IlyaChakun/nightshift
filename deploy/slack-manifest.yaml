# Slack app manifest. Create the app from this file separately in each
# workspace so it stays an internal app (design section 17).
display_information:
  name: Nightshift
  description: Software factory. Talk to Lead, approve specs and releases.
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: nightshift
    always_online: true
  slash_commands:
    - command: /ns
      description: Status, pause, review mode and other factory commands
      usage_hint: status | pause | resume | review all|blast_radius|off | cancel <task>
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:history
      - groups:history
      - channels:read
      - files:read
      - files:write
      - commands
      - im:write
      - reactions:read
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - app_home_opened
      - reaction_added
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
