version: "2"

run:
  timeout: 5m

# Rules live in tools first (design section 9, docs/design/05-assurance.md: enforcement tool > rubric > guidance).
# standards/industry/go/style.md is the page for tenants: it describes their template
# standards/industry/go/files/.golangci.yml and states as prose some rules this file enforces.
# This file enables more linters than the template, but not contextcheck: here it flags only
# test helpers that take t and one deferred rollback on r.Context() (9 issues, 2026-11-27).
# Deliberately not enabled; tried on this code base, they add noise without catching real defects:
# wrapcheck and err113 (flag every unwrapped or ad hoc error, also in tests), gochecknoglobals
# (flags read-only tables and sentinel errors), thelper (flags t.Run bodies), varnamelen,
# exhaustruct, mnd, lll, wsl, nlreturn, godot (style taste), funlen and cyclop (gocognit measures
# the same better), paralleltest, testpackage, ireturn.
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    # Architecture and security.
    - depguard
    - gosec
    # Errors: wrap with %w, compare with errors.Is/As, no swallowed errors.
    - errorlint
    - errname
    - nilerr
    - nilnesserr
    - nilnil
    # Context first, never stored in a struct, no requests or logs without it.
    - containedctx
    - noctx
    - fatcontext
    - sloglint
    - spancheck
    # Resources are closed and checked.
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    # Keep it simple: no dead parameters, needless conversions or copies.
    - dupl
    - gocognit
    - unconvert
    - unparam
    - wastedassign
    # Correctness traps.
    - durationcheck
    - errchkjson
    - exhaustive
    - gocritic
    - makezero
    - predeclared
    - reassign
    - recvcheck
    # Style and current idioms (Go Code Review Comments via revive).
    - forbidigo
    - gochecknoinits
    - misspell
    - modernize
    - nolintlint
    - revive
    - usestdlibvars
    - usetesting
  settings:
    gocognit:
      min-complexity: 20
    usetesting:
      # Tests take t.Context(), which ends with the test (standards/industry/go/style.md).
      context-background: true
      context-todo: true
    exhaustive:
      # A switch over our own enum lists every case; `default:` states that the rest is ignored on purpose.
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print(f|ln)?|print|println)$
          msg: log with log/slog or write to an injected io.Writer
        - pattern: ^log\.(Print|Fatal|Panic)(f|ln)?$
          msg: use log/slog; return errors instead of exiting
        - pattern: ^os\.(Getenv|LookupEnv|Environ|Setenv|Unsetenv|Clearenv|ExpandEnv)$
          msg: read secrets with config.Secrets and settings from config files; build a child's env from an explicit list
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      kv-only: true
      no-global: all
      context: scope
      static-msg: true
      key-naming-case: snake
    depguard:
      rules:
        # The core knows no vendors: provider SDKs only in internal/execution/harness,
        # integration SDKs only in internal/adapters (AGENTS.md, rules 1 and 3).
        core:
          files:
            - "$all"
            - "!**/internal/execution/harness/**"
            - "!**/internal/adapters/**"
          deny:
            - pkg: github.com/anthropics
              desc: model providers are reached only through internal/execution/harness
            - pkg: github.com/openai
              desc: model providers are reached only through internal/execution/harness
            - pkg: github.com/slack-go
              desc: chat SDKs belong in internal/adapters
            - pkg: github.com/google/go-github
              desc: GitHub SDK belongs in internal/adapters
            - pkg: github.com/andygrunwald/go-jira
              desc: tracker SDKs belong in internal/adapters

  exclusions:
    rules:
      # Test data is literal and a broken encoding fails the test that reads it.
      - path: _test\.go
        linters: [errchkjson]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
