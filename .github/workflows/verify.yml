name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # a newer push replaces a PR run; main runs always finish

# lint, test and checks run in parallel, so the slowest one sets the wall time. A pull request that
# changes only documentation (docs/, .agents/, root *.md) runs the document checks and skips the
# rest. Pushes to main always run everything. ci-ok is the one check that is always reported, so
# a branch rule can require it and a skipped job never blocks a merge.
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            # Anything outside the documentation paths counts as code; so does an empty diff.
            if git diff --name-only --no-renames "$BASE" HEAD | grep -qvE '^(docs/|\.agents/|[^/]+\.md$)'; then
              code=true
            elif [ -n "$(git diff --name-only --no-renames "$BASE" HEAD)" ]; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      # Caches are saved per commit and restored by prefix, so each run starts from the newest one
      # and a repeat run skips most of the compile and analysis.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: lint-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml', '.golangci.yml') }}-
            lint-${{ runner.os }}-
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: go golangci-lint sqlc # only what this job runs
      - run: make fmt gen-check lint

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      # Caches are saved per commit and restored by prefix, so each run starts from the newest one
      # and a repeat run skips most of the compile and analysis.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: test-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            test-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml', '.golangci.yml') }}-
            test-${{ runner.os }}-
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: go # only what this job runs
      - run: make test

  checks:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      # Caches are saved per commit and restored by prefix, so each run starts from the newest one
      # and a repeat run skips most of the compile and analysis.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
          key: checks-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            checks-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml', '.golangci.yml') }}-
            checks-${{ runner.os }}-
      - if: needs.changes.outputs.code == 'true'
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - if: needs.changes.outputs.code != 'true'
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: gitleaks npm:markdownlint-cli2 # documents only need these two
      - if: needs.changes.outputs.code == 'true'
        run: make vuln secrets docs ci-lint repo-check sql-lint docker-lint
      - if: needs.changes.outputs.code != 'true'
        run: make secrets docs repo-check

  ci-ok:
    needs: [changes, lint, test, checks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
