version: 2
# One grouped pull request per ecosystem and week. A major version comes in its own pull request.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 } # let fresh releases age before we take them
    open-pull-requests-limit: 5
    groups:
      go: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups:
      actions: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups:
      images: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups:
      compose-images: { patterns: ["*"], update-types: [minor, patch] }
