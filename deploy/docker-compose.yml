# Phase 1: the book, nightshift and backups (design sections 3 and 22). The worker,
# egress proxies and the obs profile come in phase 2. Start: docker compose up -d.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]

services:
  postgres:
    image: postgres:18.1-alpine@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
    environment:
      POSTGRES_DB: book
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin
    secrets: [pg_admin, pg_owner_password, pg_nightshift_password, pg_backup_password]   # init creates the login roles
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [core]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres", "-d", "book"], interval: 5s }
    restart: unless-stopped

  migrate:                                  # one shot as the schema owner; serve never holds this secret
    build: { context: .., target: nightshift }
    <<: *hardened
    command: ["serve", "--migrate-only"]
    secrets: [pg_owner]
    networks: [core]
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  nightshift:
    build: { context: .., target: nightshift }
    <<: *hardened
    secrets: [pg_nightshift, chat_bot_token, chat_app_token]
    volumes: ["${NIGHTSHIFT_CONFIG:-./config}:/etc/nightshift:ro"]
    networks: [core, internet]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck: { test: ["CMD", "nightshift", "status", "--health"], interval: 15s }
    stop_grace_period: 40s                  # serve waits up to 30s for running jobs
    restart: unless-stopped

  backup:                                   # pg_dump hourly, restore test weekly (busybox crond)
    image: postgres:18.1-alpine@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
    command: ["/etc/backup/cron.sh", "crontabs"]
    secrets: [pg_backup_password]           # read-only role, not the superuser
    volumes:
      - dumps:/dumps
      - ./backup:/etc/backup:ro
    networks: [core]
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped

  offsite:                                  # restic copy of the dumps, daily, encrypted
    image: restic/restic:0.18.1@sha256:39d9072fb5651c80d75c7a811612eb60b4c06b32ffe87c2e9f3c7222e1797e76
    entrypoint: ["/etc/backup/cron.sh", "crontabs-offsite"]
    secrets: [restic_repository, restic_password]
    volumes:
      - dumps:/dumps:ro
      - ./backup:/etc/backup:ro
      - "${NIGHTSHIFT_OFFSITE:-./offsite}:/offsite"   # a second disk; or point the repository at cloud storage
    networks: [internet]
    restart: unless-stopped

networks:
  core: { internal: true }
  internet: {}

secrets:                                    # deploy/init-secrets.sh creates them; mode 0400, not in git
  pg_admin: { file: ./secrets/pg_admin }
  pg_owner_password: { file: ./secrets/pg_owner_password }
  pg_nightshift_password: { file: ./secrets/pg_nightshift_password }
  pg_backup_password: { file: ./secrets/pg_backup_password }
  pg_owner: { file: ./secrets/pg_owner }               # postgres://book_owner:<password>@postgres:5432/book
  pg_nightshift: { file: ./secrets/pg_nightshift }     # postgres://nightshift:<password>@postgres:5432/book
  chat_bot_token: { file: ./secrets/chat_bot_token }
  chat_app_token: { file: ./secrets/chat_app_token }
  restic_repository: { file: ./secrets/restic_repository }
  restic_password: { file: ./secrets/restic_password }

volumes: { pgdata: {}, dumps: {} }
