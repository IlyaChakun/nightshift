# The book, nightshift, the worker behind an egress proxy, and backups (design sections 3
# and 22). The obs profile comes with phase 2 item 9. Start: docker compose up -d.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]

services:
  postgres:                                 # pgvector for optional embeddings (design section 13); Debian, uid 999
    image: pgvector/pgvector:pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
    environment:
      POSTGRES_DB: book
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin
    secrets: [pg_admin, pg_owner_password, pg_nightshift_password, pg_backup_password]   # init creates the login roles
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [core]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres", "-d", "book"], interval: 5s }
    restart: unless-stopped

  migrate:                                  # one shot as the schema owner; serve never holds this secret
    build: { context: .., target: nightshift }
    <<: *hardened
    command: ["serve", "--migrate-only"]
    secrets: [pg_owner]
    networks: [core]
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  nightshift:
    build: { context: .., target: nightshift }
    <<: *hardened
    command: ["serve", "--jobs-listen", ":8081", "--repos", "/repos", "--deployer-url", "http://deployer:8083"]   # the conductor runs only tenants with a GitHub credential
    secrets: [pg_nightshift, chat_bot_token, chat_app_token, worker_token_sha256, github_token, github_app_id, github_app_key, mcp_token, deployer_token]
    volumes: ["${NIGHTSHIFT_CONFIG:-./config}:/etc/nightshift:ro", "artifacts:/artifacts:ro", "repos:/repos",
              "./secrets/tenants:/run/secrets/tenants:ro"]   # optional per-tenant tokens, tenants/<name>/github_token
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "${NIGHTSHIFT_OTLP:-}"   # obs profile: http://lgtm:4318; empty keeps spans in memory
    networks: [core, jobs, internet, deploy]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck: { test: ["CMD", "nightshift", "status", "--health"], interval: 15s }
    stop_grace_period: 40s                  # serve waits up to 30s for running jobs
    restart: unless-stopped

  backup:                                   # pg_dump hourly, restore test weekly (busybox crond)
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    command: ["/etc/backup/cron.sh", "crontabs"]
    secrets: [pg_backup_password]           # read-only role, not the superuser
    volumes:
      - dumps:/dumps
      - ./backup:/etc/backup:ro
    networks: [core]
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped

  worker:                                   # one job at a time; parallelism = replicas; no Postgres access
    build:
      context: ..
      target: worker
      args:                                 # pin the agent CLIs; empty builds without that one
        CLAUDE_CODE_VERSION: "${CLAUDE_CODE_VERSION:-}"
        CODEX_VERSION: "${CODEX_VERSION:-}"
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]               # the runner starts the agent as uid 20001
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:exec,mode=1777"]          # Go, Node and Gradle run what they build in /tmp; the agent runs code anyway
    shm_size: 1gb                           # Chromium for Playwright
    user: "0"
    command: ["work", "--jobs-url", "http://nightshift:8081", "--secrets", "/run/worker-secrets",
      "--agent-uid", "20001", "--agent-gid", "20001", "--toolchain-url", "http://toolchain:8082"]
    secrets:                                # jobs API token and harness credentials; no GitHub, chat or tracker token
      # Mounted under a root-only directory of the image: Docker Desktop shows a mounted file as
      # owned by whoever reads it, so the file mode alone does not keep the agent out.
      - { source: worker_token, target: /run/worker-secrets/worker_token }
      - { source: harness, target: /run/worker-secrets/harness }
    volumes: ["work:/work", "artifacts:/artifacts", "agent-home:/home/agent", "repos:/repos:ro"]
    networks: [jobs]                        # no direct way out
    environment:
      HTTPS_PROXY: "http://egress:4750"
      NO_PROXY: "nightshift,lgtm,modcache,toolchain"
      GOPROXY: "http://modcache:3000"       # Go modules come from the cache service, not through the egress allowlist
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      CLAUDE_CODE_ENABLE_TELEMETRY: "${NIGHTSHIFT_TELEMETRY:-0}"   # obs profile: 1, with the endpoint below
      OTEL_EXPORTER_OTLP_ENDPOINT: "${NIGHTSHIFT_OTLP:-}"
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
      CLAUDE_CODE_ENHANCED_TELEMETRY_BETA: "${NIGHTSHIFT_TELEMETRY:-0}"   # agent spans are beta in the CLI
    deploy: { replicas: 1, resources: { limits: { cpus: "4", memory: 8g, pids: 2048 } } }
    depends_on: [nightshift, egress, modcache, toolchain]
    restart: unless-stopped

  egress:                                   # Smokescreen: the only way out for the worker, by allowlist
    build: { context: .., target: egress }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["--config-file", "/etc/smokescreen/config.yaml", "--egress-acl-file", "/etc/smokescreen/acl.yaml",
      "--listen-ip", "0.0.0.0", "--listen-port", "4750"]
    volumes:
      - ./egress-acl.yaml:/etc/smokescreen/acl.yaml:ro
      - ./egress-config.yaml:/etc/smokescreen/config.yaml:ro
    networks: [jobs, internet]
    restart: unless-stopped

  modcache:                                 # Athens: Go modules for the worker; the only container that reaches proxy.golang.org and storage.googleapis.com
    image: gomods/athens:v0.20.0@sha256:3620ce7230c723bdeac51f112541a659bf44923416b02f69cabf981fd9c0324a
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      ATHENS_STORAGE_TYPE: disk
      ATHENS_DISK_STORAGE_ROOT: /var/lib/athens
      ATHENS_PORT: ":3000"
      ATHENS_GO_BINARY_ENV_VARS: "GOPROXY=https://proxy.golang.org"   # modules come from the public proxy, never from a version control host
    volumes: ["modcache:/var/lib/athens"]
    networks: [jobs, internet]              # the worker reaches only this port; the internet side is this service's own
    restart: unless-stopped

  toolchain:                                # installs the toolchain a project pins, before the agent starts (ADR 0010); the worker calls it, the agent has no way to the tool hosts
    build: { context: .., target: worker }
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]               # mise runs as uid 20001, the token stays with root
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:exec,mode=1777"]
    user: "0"
    command: ["toolchain", "--secrets", "/run/worker-secrets", "--agent-uid", "20001", "--agent-gid", "20001"]
    secrets:
      - { source: worker_token, target: /run/worker-secrets/worker_token }   # the same token authenticates the worker's call
    volumes: ["work:/work", "agent-home:/home/agent"]
    environment:
      HTTPS_PROXY: "http://egress-install:4750"
      NO_PROXY: "localhost,modcache"
      GOPROXY: "http://modcache:3000"       # Go tools come from the cache service, as the worker's modules do
    networks: [jobs, install]               # the worker reaches it on jobs; its way out is the install allowlist, not the worker's
    depends_on: [egress-install, modcache]
    restart: unless-stopped

  egress-install:                           # Smokescreen with the tool hosts; only the toolchain service reaches it, the worker is not on the install network
    build: { context: .., target: egress }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["--config-file", "/etc/smokescreen/config.yaml", "--egress-acl-file", "/etc/smokescreen/acl.yaml",
      "--listen-ip", "0.0.0.0", "--listen-port", "4750"]
    volumes:
      - ./egress-install-acl.yaml:/etc/smokescreen/acl.yaml:ro
      - ./egress-config.yaml:/etc/smokescreen/config.yaml:ro
    networks: [install, internet]
    restart: unless-stopped

  deployer:                                 # brings previews and releases up on the Docker engine (design section 17); the only service with the socket
    profiles: [deploy]
    build: { context: .., target: deployer }
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]              # root without it cannot open deployer_token, which is 0400 and owned by nightshift
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    user: "0"                               # the socket belongs to root; the worker and the agent never reach this service
    command: ["deployer", "--work", "${NIGHTSHIFT_DEPLOY_DIR:-/tmp/nightshift-deploy}"]
    secrets: [deployer_token]
    environment:
      DOCKER_CONFIG: /tmp/docker
    volumes:
      - repos:/repos:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - "${NIGHTSHIFT_DEPLOY_DIR:-/tmp/nightshift-deploy}:${NIGHTSHIFT_DEPLOY_DIR:-/tmp/nightshift-deploy}"   # the same path on the host, because the engine mounts a checkout from there
    networks: [deploy]
    restart: unless-stopped

  grafana-login:                            # obs profile: one shot that gives grafana_ro its login
    build: { context: .., target: nightshift }
    <<: *hardened
    profiles: [obs]
    command: ["serve", "--migrate-only"]    # migrations are already applied; this sets the password
    secrets: [pg_owner, pg_grafana_password]
    networks: [core]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: "no"

  lgtm:                                     # obs profile: Grafana, Loki, Tempo and Prometheus in one container
    image: grafana/otel-lgtm:0.41.1@sha256:1b852b77d7bcadb7699bfe7c78a51d059dff85168de674728cf7abf4474645e5
    profiles: [obs]
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"    # the image turns it on by default
      GF_SECURITY_ADMIN_PASSWORD: "$$__file{/run/secrets/grafana_admin_password}"   # Grafana expands it
    command: ["/etc/grafana-nightshift/start.sh"]   # sets that password on an existing volume too
    ports: ["127.0.0.1:3000:3000"]          # Grafana from the local machine only
    secrets: [pg_grafana_password, grafana_admin_password]   # the book data source logs in as grafana_ro (deploy/grafana)
    depends_on: { grafana-login: { condition: service_completed_successfully } }
    volumes:
      - lgtm:/data
      - ./grafana/datasource.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/nightshift.yaml:ro
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/nightshift.yaml:ro
      - ./grafana/dashboards:/etc/grafana-nightshift/dashboards:ro
      - ./grafana/start.sh:/etc/grafana-nightshift/start.sh:ro
    networks: [core, jobs, ui]              # ui, because a port cannot be published from an internal network
    restart: unless-stopped

  offsite:                                  # restic copy of the dumps, daily, encrypted
    image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
    entrypoint: ["/etc/backup/cron.sh", "crontabs-offsite"]
    secrets: [restic_repository, restic_password]
    volumes:
      - dumps:/dumps:ro
      - ./backup:/etc/backup:ro
      - "${NIGHTSHIFT_OFFSITE:-./offsite}:/offsite"   # a second disk; or point the repository at cloud storage
    networks: [internet]
    restart: unless-stopped

networks:
  core: { internal: true }                  # Postgres and nightshift
  jobs: { internal: true }                  # worker, nightshift (jobs API), egress, lgtm
  install: { internal: true }               # toolchain and its proxy; the worker is not on it
  deploy: { internal: true }                # nightshift and the deployer only
  ui: {}                                    # only to publish Grafana on 127.0.0.1
  internet: {}

secrets:                                    # deploy/init-secrets.sh creates them; mode 0400, not in git
  pg_admin: { file: ./secrets/pg_admin }
  pg_owner_password: { file: ./secrets/pg_owner_password }
  pg_nightshift_password: { file: ./secrets/pg_nightshift_password }
  pg_backup_password: { file: ./secrets/pg_backup_password }
  pg_owner: { file: ./secrets/pg_owner }               # postgres://book_owner:<password>@postgres:5432/book
  pg_nightshift: { file: ./secrets/pg_nightshift }     # postgres://nightshift:<password>@postgres:5432/book
  pg_grafana_password: { file: ./secrets/pg_grafana_password }   # role grafana_ro; obs profile only
  grafana_admin_password: { file: ./secrets/grafana_admin_password }   # Grafana user admin; obs profile only
  chat_bot_token: { file: ./secrets/chat_bot_token }
  chat_app_token: { file: ./secrets/chat_app_token }
  github_token: { file: ./secrets/github_token }       # empty until you paste one; nightshift only
  github_app_id: { file: ./secrets/github_app_id }     # the GitHub App, preferred over the token; nightshift only
  github_app_key: { file: ./secrets/github_app_key }
  mcp_token: { file: ./secrets/mcp_token }
  deployer_token: { file: ./secrets/deployer_token }   # nightshift and the deployer only
  restic_repository: { file: ./secrets/restic_repository }
  restic_password: { file: ./secrets/restic_password }
  worker_token: { file: ./secrets/worker_token }               # read by the worker only
  worker_token_sha256: { file: ./secrets/worker_token.sha256 } # nightshift checks the token against this hash
  harness: { file: ./secrets/harness }                         # directory, one file per credential; worker only

volumes: { pgdata: {}, dumps: {}, work: {}, artifacts: {}, agent-home: {}, repos: {}, lgtm: {}, modcache: {} }
