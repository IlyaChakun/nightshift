# Base Python lint configuration from the Nightshift standards (standards/industry/python).
# Copied by `nightshift standards sync` when the project has none; the project owns it afterwards.
line-length = 100

[lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[lint.per-file-ignores]
"tests/**" = ["S101"]
