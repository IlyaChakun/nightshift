# Tool versions for local work, the worker image and CI.
# Checksums live in mise.lock: run `mise lock --platform linux-x64,linux-arm64,macos-arm64`
# after changing a version, and install with `mise install --locked`.
[settings]
lockfile = true

[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
gitleaks = "8.30.1"
osv-scanner = "2.7.1"
actionlint = "1.7.12"
zizmor = "1.33.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.10.0"
"npm:markdownlint-cli2" = "0.24.2"
